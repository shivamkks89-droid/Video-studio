<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid dark background -->
  <rect width="512" height="512" fill="#0A0A0B"/>

  <!-- Subtle radial glow behind logo -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2FF3D" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#E2FF3D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E2FF3D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- Rounded lime logo square -->
  <rect x="188" y="188" width="136" height="136" rx="30" ry="30" fill="#E2FF3D"/>

  <!-- Film-reel icon on the tile -->
  <g transform="translate(256 256)" fill="#0A0A0B">
    <!-- outer ring notch -->
    <rect x="-52" y="-38" width="104" height="76" rx="10" ry="10"/>
    <!-- perforations left -->
    <rect x="-58" y="-30" width="8" height="10" rx="2" fill="#E2FF3D"/>
    <rect x="-58" y="-12" width="8" height="10" rx="2" fill="#E2FF3D"/>
    <rect x="-58" y="6"   width="8" height="10" rx="2" fill="#E2FF3D"/>
    <rect x="-58" y="20"  width="8" height="10" rx="2" fill="#E2FF3D"/>
    <!-- perforations right -->
    <rect x="50" y="-30" width="8" height="10" rx="2" fill="#E2FF3D"/>
    <rect x="50" y="-12" width="8" height="10" rx="2" fill="#E2FF3D"/>
    <rect x="50" y="6"   width="8" height="10" rx="2" fill="#E2FF3D"/>
    <rect x="50" y="20"  width="8" height="10" rx="2" fill="#E2FF3D"/>
    <!-- centre play triangle -->
    <path d="M -10 -14 L 18 0 L -10 14 Z" fill="#E2FF3D"/>
  </g>

  <!-- Wordmark below the tile -->
  <g font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <text x="256" y="378" font-size="34" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">
      CineReel<tspan fill="#E2FF3D">.</tspan>AI
    </text>
    <text x="256" y="404" font-size="11" font-weight="500" fill="#71717a" letter-spacing="4">
      AI VIDEO STUDIO
    </text>
  </g>
</svg>
