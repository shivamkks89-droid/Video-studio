crons:
  - name: daily-fraud-summary
    description: "Emails the admin yesterday's fraud alerts, blocked users and new signups at 11am IST"
    cron: "0 11 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/fraud-summary"
    method: POST
    enabled: true
